name: Level 0 map asset upload

on:
  push:
    branches: [main]
    paths:
      - '.map_upload/trigger.txt'

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --quiet pillow numpy opencv-python-headless

      - name: Generate Level 0 map assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import numpy as np, cv2, math, os, shutil

          source='docs/reference/level-0/level-0-final-map.png'
          outdir='assets/level_0/maps'
          shutil.rmtree(outdir, ignore_errors=True)
          os.makedirs(outdir, exist_ok=True)

          original=Image.open(source).convert('RGB')
          working=original.resize((2048,1994), Image.Resampling.LANCZOS)
          raw=np.array(working)
          H,W=raw.shape[:2]
          bg=np.array([86,86,86],dtype=np.uint8)

          # Keep the connected map; discard detached handwritten notes for sector crops.
          dist=np.linalg.norm(raw.astype(int)-bg.astype(int),axis=2)
          fg=(dist>25).astype('uint8')
          _,labels,stats,_=cv2.connectedComponentsWithStats(fg,8)
          largest=1+int(np.argmax(stats[1:,cv2.CC_STAT_AREA]))
          map_mask=(labels==largest).astype('uint8')
          map_mask=cv2.dilate(map_mask,np.ones((3,3),np.uint8),iterations=1)
          clean=np.tile(bg,(H,W,1))
          clean[map_mask.astype(bool)]=raw[map_mask.astype(bool)]

          # Collect color-connected regions and use the 48 largest real map regions.
          colors,counts=np.unique(clean.reshape(-1,3),axis=0,return_counts=True)
          candidates=[]
          for color,pixel_count in zip(colors,counts):
              if tuple(color)==tuple(bg) or pixel_count<150:
                  continue
              m0=np.all(clean==color,axis=2).astype('uint8')
              n,clabels,cstats,centroids=cv2.connectedComponentsWithStats(m0,8)
              for i in range(1,n):
                  area=int(cstats[i,cv2.CC_STAT_AREA])
                  if area<350:
                      continue
                  candidates.append((area,color.copy(),clabels==i,cstats[i,:4].copy(),centroids[i].copy()))

          candidates.sort(key=lambda item:item[0],reverse=True)
          if len(candidates)<48:
              raise RuntimeError(f'Only {len(candidates)} candidate regions found')
          candidates=candidates[:48]

          sectors=[]
          for area,color,base_mask,bbox,centroid in candidates:
              mask=base_mask.astype('uint8')
              mask=cv2.morphologyEx(mask,cv2.MORPH_CLOSE,np.ones((5,5),np.uint8))
              x,y,w,h=map(int,bbox)
              contours,_=cv2.findContours((mask*255).astype('uint8'),cv2.RETR_EXTERNAL,cv2.CHAIN_APPROX_NONE)
              if not contours:
                  continue
              points=np.vstack([c[:,0,:] for c in contours]).astype(np.int32)
              points=points[::max(1,len(points)//700)]
              sectors.append({'mask':mask.astype(bool),'bbox':(x,y,w,h),'centroid':np.array(centroid,dtype=float),'points':points,'area':area})

          if len(sectors)!=48:
              raise RuntimeError(f'Expected 48 sectors after filtering, got {len(sectors)}')

          for s in sectors:
              x,y,w,h=s['bbox']; s['x1']=x; s['y1']=y; s['x2']=x+w; s['y2']=y+h

          adjacency={i:set() for i in range(48)}
          contacts={}
          threshold=40
          for i in range(48):
              a=sectors[i]; ap=a['points'].astype(np.float32)
              for j in range(i+1,48):
                  b=sectors[j]
                  dx=max(a['x1']-b['x2'],b['x1']-a['x2'],0)
                  dy=max(a['y1']-b['y2'],b['y1']-a['y2'],0)
                  if math.hypot(dx,dy)>threshold+20:
                      continue
                  bp=b['points'].astype(np.float32)
                  d2=((ap[:,None,:]-bp[None,:,:])**2).sum(axis=2)
                  pair=np.unravel_index(np.argmin(d2),d2.shape)
                  md=float(math.sqrt(d2[pair]))
                  if md<=threshold:
                      p1,p2=ap[pair[0]],bp[pair[1]]
                      contact=(p1+p2)/2.0
                      direction=b['centroid']-a['centroid']
                      direction/=np.linalg.norm(direction)+1e-6
                      contacts[(i,j)]=(contact,direction)
                      contacts[(j,i)]=(contact,-direction)
                      adjacency[i].add(j); adjacency[j].add(i)

          # Southwest-first serpentine/graph traversal used by the accepted maps.
          unassigned=set(range(48)); order=[]
          while unassigned:
              start=min(unassigned,key=lambda k:(-sectors[k]['centroid'][1],sectors[k]['centroid'][0]))
              stack=[start]
              while stack:
                  cur=stack.pop()
                  if cur not in unassigned: continue
                  unassigned.remove(cur); order.append(cur)
                  center=sectors[cur]['centroid']
                  neighbors=[n for n in adjacency[cur] if n in unassigned]
                  def angle(n):
                      v=sectors[n]['centroid']-center
                      return (math.atan2(v[1],v[0])+2*math.pi)%(2*math.pi)
                  stack.extend(sorted(neighbors,key=angle,reverse=True))
          number_of={idx:n+1 for n,idx in enumerate(order)}

          try:
              title_font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',34)
              link_font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',25)
          except OSError:
              title_font=ImageFont.load_default(); link_font=ImageFont.load_default()

          # Complete numbered master map.
          master=working.copy(); draw=ImageDraw.Draw(master)
          for idx,s in enumerate(sectors):
              num=number_of[idx]; cx,cy=s['centroid']; r=18
              draw.ellipse((cx-r,cy-r,cx+r,cy+r),fill=(205,0,0),outline='white',width=2)
              text=str(num); bb=draw.textbbox((0,0),text,font=link_font); tw,th=bb[2]-bb[0],bb[3]-bb[1]
              draw.text((cx-tw/2,cy-th/2-1),text,font=link_font,fill='white')
          master.quantize(colors=256,method=Image.Quantize.MEDIANCUT).save(os.path.join(outdir,'level0_master_numbered.png'),optimize=True)

          # Individual isolated sectors.
          for sn in range(1,49):
              idx=order[sn-1]; s=sectors[idx]; mask=s['mask']
              ys,xs=np.where(mask); minx,maxx=int(xs.min()),int(xs.max()); miny,maxy=int(ys.min()),int(ys.max())
              cps=[contacts[(idx,n)][0] for n in adjacency[idx] if (idx,n) in contacts]
              if cps:
                  cp=np.array(cps); minx=min(minx,int(cp[:,0].min())); maxx=max(maxx,int(cp[:,0].max())); miny=min(miny,int(cp[:,1].min())); maxy=max(maxy,int(cp[:,1].max()))
              pad=90; minx=max(0,minx-pad); miny=max(0,miny-pad); maxx=min(W-1,maxx+pad); maxy=min(H-1,maxy+pad)
              side=max(maxx-minx+1,maxy-miny+1); cx=(minx+maxx)//2; cy=(miny+maxy)//2
              left=max(0,cx-side//2); top=max(0,cy-side//2); right=min(W,left+side); bottom=min(H,top+side); left=max(0,right-side); top=max(0,bottom-side)
              crop=clean[top:bottom,left:right].copy(); cm=mask[top:bottom,left:right]
              isolated=np.tile(bg,(crop.shape[0],crop.shape[1],1)); isolated[cm]=crop[cm]
              canvas=Image.fromarray(isolated); draw=ImageDraw.Draw(canvas)
              title=f'Sector {sn:02d}'; bb=draw.textbbox((0,0),title,font=title_font); tw,th=bb[2]-bb[0],bb[3]-bb[1]
              draw.rounded_rectangle((10,10,24+tw,18+th),radius=7,fill=(205,0,0),outline='white',width=2); draw.text((17,12),title,font=title_font,fill='white')
              for neighbor in sorted(adjacency[idx],key=lambda n:number_of[n]):
                  linked=number_of[neighbor]; contact,normal=contacts[(idx,neighbor)]
                  point=np.array([contact[0]-left,contact[1]-top],dtype=float); tangent=np.array([-normal[1],normal[0]],dtype=float)
                  for off in (-10,0,10):
                      center=point+tangent*off; p1=center-tangent*6; p2=center+tangent*6
                      draw.line((float(p1[0]),float(p1[1]),float(p2[0]),float(p2[1])),fill='white',width=2)
                  label=point+normal*36; text=str(linked); tbb=draw.textbbox((0,0),text,font=link_font); ltw,lth=tbb[2]-tbb[0],tbb[3]-tbb[1]
                  draw.rounded_rectangle((label[0]-6,label[1]-5,label[0]+ltw+10,label[1]+lth+6),radius=5,fill=(205,0,0),outline='white',width=1)
                  draw.text((label[0]+2,label[1]-1),text,font=link_font,fill='white')
              canvas=canvas.resize((1024,1024),Image.Resampling.LANCZOS)
              canvas.convert('RGB').quantize(colors=128,method=Image.Quantize.MEDIANCUT).save(os.path.join(outdir,f'sector_{sn:02d}.png'),optimize=True)

          # Four aggregate connection sheets.
          for page in range(4):
              first=page*12+1; last=first+11; thumb=360
              sheet=Image.new('RGB',(3*thumb,4*thumb),(45,45,45))
              for offset,sn in enumerate(range(first,last+1)):
                  panel=Image.open(os.path.join(outdir,f'sector_{sn:02d}.png')).convert('RGB'); panel.thumbnail((thumb,thumb),Image.Resampling.LANCZOS)
                  x=(offset%3)*thumb+(thumb-panel.width)//2; y=(offset//3)*thumb+(thumb-panel.height)//2; sheet.paste(panel,(x,y))
              sheet.quantize(colors=128,method=Image.Quantize.MEDIANCUT).save(os.path.join(outdir,f'sectors_{first:02d}_{last:02d}_connections.png'),optimize=True)

          expected=['level0_master_numbered.png']+[f'sector_{i:02d}.png' for i in range(1,49)]+['sectors_01_12_connections.png','sectors_13_24_connections.png','sectors_25_36_connections.png','sectors_37_48_connections.png']
          missing=[f for f in expected if not os.path.exists(os.path.join(outdir,f))]
          if missing: raise RuntimeError(f'Missing assets: {missing}')
          print(f'Generated {len(expected)} files')
          PY

      - name: Commit only final map assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .map_upload
          rm -f .github/workflows/map_upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/level_0/maps .map_upload .github/workflows/map_upload.yml
          git commit -m "assets: add Level 0 sector maps"
          git push origin HEAD:main
